name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revisent
          POSTGRES_PASSWORD: revisent
          POSTGRES_DB: revisent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U revisent"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # App runs Celery inline (eager) in CI; Postgres is the system-under-test DB.
      DATABASE_URL: postgresql+psycopg2://revisent:revisent@localhost:5432/revisent_test
      CELERY_TASK_ALWAYS_EAGER: "true"
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: System deps (ffmpeg + OpenGL for OpenCV)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Fetch model weights
        run: python scripts/fetch_models.py

      - name: Alembic migrations apply (Postgres)
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        # Each suite runs in its own process: the test files that need an isolated
        # DB set DATABASE_URL/DATA_DIR at import, which only takes effect before
        # the settings singleton is created (i.e. per fresh process).
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
